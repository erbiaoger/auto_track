version: 1
default_method: hybrid
worker_module: hybrid_vehicle_tracker.web.worker
methods:
  - id: hybrid
    label: Hybrid：ResUNet + Hough + GNN/MILP
    kind: deep_learning
    preset_id: hybrid_v9_morphology_16384
    interpreter: hybrid_vehicle_tracker_20260724/.venv/bin/python
    workdir: hybrid_vehicle_tracker_20260724
    pythonpath:
      - hybrid_vehicle_tracker_20260724/src
    config: hybrid_vehicle_tracker_20260724/configs/day11_120s_v9.yaml
    checkpoint: hybrid_vehicle_tracker_20260724/checkpoints/v9_synthetic_morphology_16384/hybrid_final.pt
    input: raw_pre_gauss
    output_root: methods/hybrid/results/web_sessions
  - id: peak_slot
    worker_module: autotrack.web_worker
    label: PeakSlotNet
    kind: deep_learning
    preset_id: peak_slot_v4_noisy_badch
    interpreter: .venv/bin/python
    workdir: .
    pythonpath:
      - hybrid_vehicle_tracker_20260724/src
      - .
    checkpoint: models/peak_slot_v4_120s_noisy_badch_cuda/checkpoint_best.pt
    input: gauss
    output_root: methods/peak_slot/results/web_sessions
  - id: vehicle_peak_set
    worker_module: autotrack.web_worker
    label: Vehicle Peak-Set Transformer
    kind: deep_learning
    preset_id: peakguided_crossing_curriculum_recall
    interpreter: .venv/bin/python
    workdir: repro_vehicle_pipeline_20260629
    pythonpath:
      - hybrid_vehicle_tracker_20260724/src
      - repro_vehicle_pipeline_20260629/src
    checkpoint: repro_vehicle_pipeline_20260629/results/vehicle_peakset_run/peakguided_train_realshape_crossing_curriculum/checkpoint_best.pt
    input: gauss
    output_root: methods/vehicle_peak_set/results/web_sessions
  - id: graph_search
    worker_module: autotrack.web_worker
    label: Classic Graph Search
    kind: classic_physics
    preset_id: graph_search_day11
    engine: gpu
    entrypoint: autotrack.cli.auto_track_gpu:extract_all_gpu
    direction: reverse
    interpreter: .venv/bin/python
    workdir: .
    pythonpath:
      - hybrid_vehicle_tracker_20260724/src
      - .
    input: gauss
    output_root: methods/graph_search/results/web_sessions
