[project]
name = "bafang-auto-track"
version = "0.1.0"
description = "DAS vehicle trajectory extraction, training data visualization, and trajectory-query model training."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "obspy>=1.4.2",
    "PyYAML>=6.0",
    "pyqt6>=6.10.2",
    "scipy>=1.17.0",
    "setuptools==79.0.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "cupy-cuda12x>=13.0",
    "uvicorn[standard]>=0.34",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.workspace]
members = [
    "common",
    "vehicle_replay_web",
    "methods/hybrid_vehicle_tracker",
    "methods/peak_slot_tracker",
    "methods/vehicle_peak_set_tracker",
    "methods/graph_search_tracker",
    "methods/track_slot_tracker",
    "methods/compact_slot_tracker",
    "methods/trajectory_query_tracker",
    "methods/query_mask_tracker",
    "methods/trajectory_energy_tracker",
    "methods/single_vehicle_trace_tracker",
    "methods/single_vehicle_focus_tracker",
    "methods/vehicle_proposal_trace_pipeline",
    "methods/vehicle_set_tracker",
    "methods/kalman_seed_tracker",
    "methods/hungarian_assignment_tracker",
]

[tool.pytest.ini_options]
pythonpath = ["."]
