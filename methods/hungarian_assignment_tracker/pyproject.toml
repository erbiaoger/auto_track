[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hungarian-assignment-tracker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["auto-track-common", "numpy>=2.4.2", "scipy>=1.17.0"]

[tool.uv.sources]
auto-track-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/hungarian_assignment_tracker"]
